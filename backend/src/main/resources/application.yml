server:
  port: 8181

spring:
  application:
    name: course-match
  
  datasource:
    url: jdbc:mysql://localhost:3397/course_match?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: localhost
      port: 6470

logging:
  level:
    com.example.coursematch: DEBUG
    org.hibernate.SQL: DEBUG